# Local run of the same image that is deployed to Cloud Run.
#   docker compose up --build   ->  http://localhost:8080
services:
  oceanembed:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # - MODEL_CHECKPOINT=gs://YOUR_BUCKET/best_model.pt
    volumes:
      # Mount local checkpoints so a freshly trained model is picked up without rebuilding.
      - ./artifacts/checkpoints:/app/artifacts/checkpoints:ro
