# CMEMS Dataset Mappings
# This configuration drives the Real Data Adapters to map from CMEMS provider
# variable names to OceanEmbed canonical variable names.

datasets:
  # 1. Target Subsurface (GLORYS)
  glorys:
    product_id: "GLOBAL_MULTIYEAR_PHY_001_030"
    dataset_id: "cmems_mod_glo_phy_my_0.083deg_P1D-m"
    provider: "CMEMS"
    coordinate_conventions:
      lon: ["longitude", "lon"]
      lat: ["latitude", "lat"]
      time: ["time"]
      depth: ["depth"]
    variable_mapping:
      thetao: "target_temp"
    lon_convention: "180" # Maps back to 0-360 internally if needed, but specifies source format
    depth_convention: "positive_down"

  # 2. Surface Observations (OSTIA SST)
  ostia:
    product_id: "SST_GLO_SST_L4_REP_OBSERVATIONS_010_011"
    dataset_id: "C3S-GLO-SST-L4-REP-OBS-SST"
    provider: "CMEMS"
    coordinate_conventions:
      lon: ["lon"]
      lat: ["lat"]
      time: ["time"]
    variable_mapping:
      analysed_sst: "sst"
    lon_convention: "180"

  # 3. Surface Salinity (SMOS/Multi-Obs)
  sss:
    product_id: "MULTIOBS_GLO_PHY_S_SURFACE_MYNRT_015_013"
    dataset_id: "cmems_obs-mob_glo_phy-sss_my_multi_P1D"
    provider: "CMEMS"
    coordinate_conventions:
      lon: ["lon"]
      lat: ["lat"]
      time: ["time"]
    variable_mapping:
      sos: "sss"
    lon_convention: "180"

  # 4. Sea Surface Height (Altimetry)
  ssh:
    product_id: "SEALEVEL_GLO_PHY_L4_MY_008_047"
    dataset_id: "cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D"
    provider: "CMEMS"
    coordinate_conventions:
      lon: ["longitude"]
      lat: ["latitude"]
      time: ["time"]
    variable_mapping:
      adt: "ssh" # Absolute Dynamic Topography
      sla: "sla" # Sea Level Anomaly
    lon_convention: "360"

  # 5. Surface Winds (ASCAT)
  ascat:
    product_id: "WIND_GLO_PHY_L4_MY_012_006"
    dataset_id: "cmems_obs-wind_glo_phy_my_l4_0.125deg_PT1H"
    provider: "CMEMS"
    coordinate_conventions:
      lon: ["longitude"]
      lat: ["latitude"]
      time: ["time"]
    variable_mapping:
      eastward_wind: "wind_u"
      northward_wind: "wind_v"
    lon_convention: "180"

  # 6. Surface Currents (GlobCurrent)
  globcurrent:
    product_id: "MULTIOBS_GLO_PHY_MYNRT_015_003"
    dataset_id: "cmems_obs-mob_glo_phy-cur_my_0.25deg_P1D-m"
    provider: "CMEMS"
    coordinate_conventions:
      lon: ["longitude"]
      lat: ["latitude"]
      time: ["time"]
    variable_mapping:
      uo: "current_u"
      vo: "current_v"
    lon_convention: "180"

  # 7. Argo Profiles (Validation)
  argo:
    product_id: "INSITU_GLO_PHY_TS_DISCRETE_MY_013_001"
    dataset_id: "cmems_obs-ins_glo_phy-ts_my_argo_irr"
    provider: "CMEMS / ARGO"
    coordinate_conventions:
      lon: ["LONGITUDE"]
      lat: ["LATITUDE"]
      time: ["TIME"]
      depth: ["PRES"]
    variable_mapping:
      TEMP: "argo_temp"
    lon_convention: "180"
    depth_convention: "positive_down"
